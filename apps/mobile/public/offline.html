<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F2E8" />
    <title>Curio is offline</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { align-items: center; background: #F6F2E8; color: #171713; display: flex; justify-content: center; margin: 0; min-height: 100dvh; padding: 24px; }
      main { background: #FFFCF6; border: 1px solid #DDD7CA; border-radius: 28px; box-shadow: 0 16px 48px rgba(52, 45, 34, .1); max-width: 420px; padding: 30px; width: 100%; }
      .mark { height: 42px; margin-bottom: 28px; position: relative; width: 42px; }
      .petal { border-radius: 14px; height: 25px; position: absolute; width: 16px; }
      .peach { background: #EAAE87; left: 2px; top: 9px; transform: rotate(-28deg); }
      .sky { background: #AFC6D9; left: 14px; top: 1px; transform: rotate(5deg); }
      .sage { background: #AFC7A6; left: 24px; top: 15px; transform: rotate(38deg); }
      p:first-of-type { color: #777267; font-size: 11px; font-weight: 750; letter-spacing: .13em; margin: 0 0 10px; text-transform: uppercase; }
      h1 { font-family: Georgia, serif; font-size: 34px; letter-spacing: -.03em; line-height: 1.08; margin: 0 0 12px; }
      p { color: #777267; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
      button { background: #24251F; border: 0; border-radius: 15px; color: #FFFCF6; cursor: pointer; font: inherit; font-size: 14px; font-weight: 700; min-height: 50px; padding: 0 20px; width: 100%; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <span class="petal peach"></span><span class="petal sky"></span><span class="petal sage"></span>
      </div>
      <p>Curio</p>
      <h1>You’re offline for a moment.</h1>
      <p>Previously opened pages may still be available. Reconnect before saving or processing something new.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
